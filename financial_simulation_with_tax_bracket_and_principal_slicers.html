<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tax vs Self-Investment Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Thai', sans-serif; background-color: #121316; color: #f3f4f6; margin: 0; padding: 0; }
        .card-bg { background-color: #222328; border: 1px solid #32353e; }
        .input-bg { background-color: #1b1c20; border: 1px solid #32353e; color: white; outline: none; }
        
        /* Custom Compact Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 4px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #32353e; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            height: 14px; width: 14px; border-radius: 50%; background: #38bdf8;
            cursor: pointer; -webkit-appearance: none; margin-top: -5px; box-shadow: 0 0 8px rgba(56,189,248,0.4);
        }
        #rateOwnSlider::-webkit-slider-thumb { background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,0.4); }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col p-2 gap-2 box-border select-none">
    
    <!-- Header -->
    <div class="flex-none px-1 pt-1 flex justify-between items-end">
        <h1 class="text-sm md:text-lg font-bold text-white">จำลองเปรียบเทียบ: ลดหย่อนภาษี vs ลงทุนเอง</h1>
    </div>

    <!-- Main Workspace (Flex Col on Mobile, Flex Row on Desktop/Tablet Landscape) -->
    <div class="flex-1 min-h-0 flex flex-col md:flex-row gap-2 overflow-hidden">
        
        <!-- Left Panel: Summaries & Chart -->
        <div class="flex-1 flex flex-col min-h-0 gap-2">
            
            <!-- Summary Cards -->
            <div class="flex-none grid grid-cols-3 gap-2">
                <div class="card-bg rounded-lg p-2 md:p-3 text-center flex flex-col justify-center">
                    <div id="taxFundValue" class="text-sm md:text-xl font-bold text-[#38bdf8] leading-none mb-1">฿0</div>
                    <div class="text-[9px] md:text-xs text-gray-400">มูลค่ากองทุนภาษี</div>
                </div>
                <div class="card-bg rounded-lg p-2 md:p-3 text-center flex flex-col justify-center">
                    <div id="ownInvestValue" class="text-sm md:text-xl font-bold text-[#34d399] leading-none mb-1">฿0</div>
                    <div class="text-[9px] md:text-xs text-gray-400">มูลค่าลงทุนเอง</div>
                </div>
                <div class="card-bg rounded-lg p-2 md:p-3 text-center flex flex-col justify-center">
                    <div id="diffValue" class="text-sm md:text-xl font-bold leading-none mb-1">฿0</div>
                    <div id="diffLabel" class="text-[9px] md:text-xs text-gray-400 whitespace-nowrap overflow-hidden text-ellipsis px-1">ส่วนต่าง</div>
                </div>
            </div>

            <!-- Dynamic Explanation -->
            <div class="flex-none text-[10px] md:text-xs p-2 rounded-lg input-bg border-l-2 border-l-[#38bdf8] leading-tight">
                <div id="dynamicExplanation">กำลังคำนวณ...</div>
            </div>

            <!-- Chart -->
            <div class="flex-1 min-h-0 card-bg rounded-lg p-2 relative">
                <canvas id="growthChart"></canvas>
            </div>
        </div>

        <!-- Right / Bottom Panel: Controls -->
        <!-- On mobile: Bottom grid. On md/desktop: Right side column -->
        <div class="flex-none w-full md:w-64 lg:w-72 card-bg rounded-lg p-3 flex flex-col gap-3 justify-center md:justify-start overflow-hidden">
            
            <div class="grid grid-cols-2 md:grid-cols-1 gap-x-4 gap-y-2 md:gap-y-4">
                
                <!-- Tax Bracket -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] md:text-xs text-gray-300">ฐานภาษี (%)</label>
                        <input type="number" id="taxBracketNum" value="10" min="5" max="35" step="5" class="input-bg w-10 md:w-14 text-center text-[10px] md:text-xs py-0.5 rounded border border-[#32353e]">
                    </div>
                    <input type="range" id="taxBracketSlider" min="5" max="35" step="5" value="10">
                </div>

                <!-- Principal -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] md:text-xs text-gray-300">เงินต้น (บาท)</label>
                        <input type="number" id="principalNum" value="200000" min="10000" max="1000000" step="10000" class="input-bg w-16 md:w-20 text-center text-[10px] md:text-xs py-0.5 rounded border border-[#32353e]">
                    </div>
                    <input type="range" id="principalSlider" min="10000" max="1000000" step="10000" value="200000">
                </div>

                <!-- Years -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] md:text-xs text-gray-300">เวลา (ปี)</label>
                        <input type="number" id="yearsNum" value="30" min="1" max="50" step="1" class="input-bg w-10 md:w-14 text-center text-[10px] md:text-xs py-0.5 rounded border border-[#32353e]">
                    </div>
                    <input type="range" id="yearsSlider" min="1" max="50" step="1" value="30">
                </div>

                <!-- Rate Tax Fund -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] md:text-xs text-[#38bdf8]">กำไรกองทุน (%)</label>
                        <input type="number" id="rateTaxNum" value="7.0" min="0" max="20" step="0.1" class="input-bg w-10 md:w-14 text-center text-[10px] md:text-xs py-0.5 rounded border border-[#32353e]">
                    </div>
                    <input type="range" id="rateTaxSlider" min="0" max="20" step="0.1" value="7.0">
                </div>

                <!-- Rate Own Fund -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] md:text-xs text-[#34d399] font-medium">กำไรลงทุนเอง (%)</label>
                        <input type="number" id="rateOwnNum" value="7.4" min="0" max="30" step="0.1" class="input-bg w-10 md:w-14 text-center text-[10px] md:text-xs py-0.5 rounded border border-[#34d399] text-[#34d399] font-bold">
                    </div>
                    <input type="range" id="rateOwnSlider" min="0" max="30" step="0.1" value="7.4">
                </div>

                <!-- Break-Even Button -->
                <div class="col-span-2 md:col-span-1 flex items-end pt-1 md:pt-2">
                    <button id="calcBreakEvenBtn" class="w-full bg-[#32353e] hover:bg-[#424652] active:bg-[#424652] text-white px-2 py-1.5 md:py-2 rounded border border-[#32353e] transition-colors text-[10px] md:text-xs flex items-center justify-center font-medium shadow-sm">
                        <svg class="w-3 h-3 md:w-4 md:h-4 mr-1 text-[#34d399]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        คำนวณเป้าหมายลงทุนเอง
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let myChart = null;

        const syncInputs = (sliderId, numId) => {
            const slider = document.getElementById(sliderId);
            const num = document.getElementById(numId);
            
            slider.addEventListener('input', (e) => { num.value = e.target.value; updateSimulation(); });
            num.addEventListener('input', (e) => { slider.value = e.target.value; updateSimulation(); });
        };

        syncInputs('taxBracketSlider', 'taxBracketNum');
        syncInputs('principalSlider', 'principalNum');
        syncInputs('yearsSlider', 'yearsNum');
        syncInputs('rateTaxSlider', 'rateTaxNum');
        syncInputs('rateOwnSlider', 'rateOwnNum');

        const formatCurrency = (num) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }).format(num);
        const formatCompact = (num) => {
            if (num >= 1000000) return '฿' + (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return '฿' + (num / 1000).toFixed(1) + 'K';
            return '฿' + num.toFixed(0);
        };

        const updateSimulation = () => {
            const taxBracketPct = parseFloat(document.getElementById('taxBracketNum').value) || 0;
            const taxBracket = taxBracketPct / 100;
            const principal = parseFloat(document.getElementById('principalNum').value) || 0;
            const years = parseInt(document.getElementById('yearsNum').value) || 0;
            const rateTax = (parseFloat(document.getElementById('rateTaxNum').value) || 0) / 100;
            const rateOwn = (parseFloat(document.getElementById('rateOwnNum').value) || 0) / 100;

            const taxRefund = principal * taxBracket;
            const ownPrincipal = principal - taxRefund;

            // Dynamic Text Update
            document.getElementById('dynamicExplanation').innerHTML = `
                <span class="text-[#38bdf8] font-semibold">กองทุน:</span> เงินต้น <b>${formatCurrency(principal)}</b> + เงินคืนภาษี <b>${formatCurrency(taxRefund)}</b><br>
                <span class="text-[#34d399] font-semibold mt-0.5 inline-block">ลงทุนเอง:</span> จ่ายภาษี ${taxBracketPct}% ทิ้งไป เหลือเงินต้นลงทุน <b>${formatCurrency(ownPrincipal)}</b>
            `;

            const labels = [];
            const dataTaxFund = [];
            const dataOwnInvest = [];
            let finalTax = 0, finalOwn = 0;

            for (let i = 0; i <= years; i++) {
                labels.push(i.toString());
                const valTax = (principal * Math.pow(1 + rateTax, i)) + taxRefund;
                dataTaxFund.push(valTax);
                if (i === years) finalTax = valTax;

                const valOwn = ownPrincipal * Math.pow(1 + rateOwn, i);
                dataOwnInvest.push(valOwn);
                if (i === years) finalOwn = valOwn;
            }

            document.getElementById('taxFundValue').innerText = formatCompact(finalTax);
            document.getElementById('ownInvestValue').innerText = formatCompact(finalOwn);

            const diffValueEl = document.getElementById('diffValue');
            const diffLabelEl = document.getElementById('diffLabel');
            const diff = finalOwn - finalTax;
            const absDiff = Math.abs(diff);

            if (diff > 0) {
                diffValueEl.innerText = '+' + formatCompact(absDiff);
                diffValueEl.className = 'text-sm md:text-xl font-bold mb-1 text-[#34d399] leading-none';
                diffLabelEl.innerText = 'ลงทุนเองชนะ';
            } else if (diff < 0) {
                diffValueEl.innerText = '+' + formatCompact(absDiff);
                diffValueEl.className = 'text-sm md:text-xl font-bold mb-1 text-[#38bdf8] leading-none';
                diffLabelEl.innerText = 'กองทุนภาษีชนะ';
            } else {
                diffValueEl.innerText = '฿0';
                diffValueEl.className = 'text-sm md:text-xl font-bold mb-1 text-gray-400 leading-none';
                diffLabelEl.innerText = 'เท่ากัน';
            }

            // Chart Update
            if (myChart) {
                myChart.data.labels = labels;
                myChart.data.datasets[0].data = dataTaxFund;
                myChart.data.datasets[1].data = dataOwnInvest;
                myChart.update();
            } else {
                const ctx = document.getElementById('growthChart').getContext('2d');
                Chart.defaults.color = '#6b7280';
                Chart.defaults.font.family = "'IBM Plex Sans Thai', sans-serif";
                
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'กองทุนลดหย่อน', data: dataTaxFund,
                                borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                borderWidth: 2, fill: true, pointRadius: 0, pointHoverRadius: 5, tension: 0.2
                            },
                            {
                                label: 'ลงทุนเอง', data: dataOwnInvest,
                                borderColor: '#34d399', borderWidth: 2, fill: false,
                                pointRadius: 0, pointHoverRadius: 5, tension: 0.2
                            }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        plugins: {
                            legend: { 
                                position: 'bottom', 
                                labels: { padding: 10, usePointStyle: true, boxWidth: 6, font: { size: 10 } } 
                            },
                            tooltip: {
                                padding: 8, backgroundColor: 'rgba(27, 28, 32, 0.95)',
                                titleFont: { size: 11 }, bodyFont: { size: 11 },
                                callbacks: {
                                    label: function(ctx) {
                                        return (ctx.dataset.label || '') + ': ' + formatCurrency(ctx.parsed.y);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                border: { display: false }, grid: { color: '#32353e', drawBorder: false },
                                ticks: { maxTicksLimit: 6, callback: function(value) { return formatCompact(value); }, font: { size: 9 } }
                            },
                            x: {
                                grid: { display: false }, ticks: { maxTicksLimit: 8, font: { size: 9 } }
                            }
                        },
                        layout: { padding: { top: 10, right: 10, left: 0, bottom: 0 } }
                    }
                });
            }
        };

        const calculateBreakEven = () => {
            const taxBracket = parseFloat(document.getElementById('taxBracketNum').value) / 100;
            const principal = parseFloat(document.getElementById('principalNum').value);
            const years = parseInt(document.getElementById('yearsNum').value);
            const rateTax = parseFloat(document.getElementById('rateTaxNum').value) / 100;

            const taxRefund = principal * taxBracket;
            const fvTax = (principal * Math.pow(1 + rateTax, years)) + taxRefund;
            const ownPrincipal = principal - taxRefund;
            
            if(ownPrincipal <= 0 || years <= 0) return;

            const requiredRateDec = Math.pow((fvTax / ownPrincipal), (1 / years)) - 1;
            const requiredRatePct = (requiredRateDec * 100).toFixed(2);
            
            document.getElementById('rateOwnNum').value = requiredRatePct;
            document.getElementById('rateOwnSlider').value = requiredRatePct;
            
            updateSimulation();

            const rateOwnNum = document.getElementById('rateOwnNum');
            rateOwnNum.classList.add('bg-[#34d399]/20');
            setTimeout(() => { rateOwnNum.classList.remove('bg-[#34d399]/20'); }, 600);
        };
        
        document.getElementById('calcBreakEvenBtn').addEventListener('click', calculateBreakEven);
        window.addEventListener('resize', () => { if (myChart) myChart.resize(); });
        
        // Initial render
        setTimeout(updateSimulation, 100);
    </script>
</body>
</html>
