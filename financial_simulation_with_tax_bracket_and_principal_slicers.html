<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax vs Self-Investment Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Thai', sans-serif; background-color: #121316; color: #f3f4f6; }
        .card-bg { background-color: #222328; border: 1px solid #32353e; }
        .input-bg { background-color: #1b1c20; border: 1px solid #32353e; color: white; transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
        <h1 class="text-2xl md:text-3xl font-bold mb-2">จำลองเปรียบเทียบ: ซื้อกองทุนลดหย่อน vs ลงทุนเอง</h1>
        <p class="text-gray-400 text-sm md:text-base">คำนวณแต้มต่อจากเงินคืนภาษี เทียบกับพลังดอกเบี้ยทบต้นเมื่อนำเงินไปลงทุนเอง</p>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 md:mb-8">
        <div class="card-bg rounded-xl p-5 md:p-6 text-center">
            <div id="taxFundValue" class="text-2xl md:text-3xl font-bold text-[#38bdf8] mb-1">฿0</div>
            <div class="text-gray-400 text-xs md:text-sm">มูลค่ากองทุนภาษีปีสุดท้าย</div>
        </div>
        <div class="card-bg rounded-xl p-5 md:p-6 text-center">
            <div id="ownInvestValue" class="text-2xl md:text-3xl font-bold text-[#34d399] mb-1">฿0</div>
            <div class="text-gray-400 text-xs md:text-sm">มูลค่าลงทุนเองปีสุดท้าย</div>
        </div>
        <div class="card-bg rounded-xl p-5 md:p-6 text-center">
            <div id="diffValue" class="text-2xl md:text-3xl font-bold mb-1">฿0</div>
            <div id="diffLabel" class="text-gray-400 text-xs md:text-sm">ส่วนต่าง</div>
        </div>
    </div>

    <!-- Chart -->
    <div class="card-bg rounded-xl p-4 md:p-6 mb-6 md:mb-8 relative w-full h-[300px] md:h-[450px]">
        <canvas id="growthChart"></canvas>
    </div>

    <!-- Controls -->
    <div class="card-bg rounded-xl p-4 md:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
        
        <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">ขั้นบันไดภาษีปัจจุบัน (%)</label>
            <select id="taxBracket" class="input-bg w-full p-2.5 md:p-3 rounded-lg outline-none focus:border-[#38bdf8]">
                <option value="5">5%</option>
                <option value="10" selected>10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
                <option value="25">25%</option>
                <option value="30">30%</option>
                <option value="35">35%</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">เงินต้นที่จะลงทุน (บาท)</label>
            <input type="number" id="principal" value="200000" class="input-bg w-full p-2.5 md:p-3 rounded-lg outline-none focus:border-[#38bdf8]">
        </div>

        <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">ระยะเวลาลงทุน (ปี)</label>
            <input type="number" id="years" value="30" class="input-bg w-full p-2.5 md:p-3 rounded-lg outline-none focus:border-[#38bdf8]">
        </div>

        <div>
            <label class="block text-sm font-medium mb-2 text-gray-300">ผลตอบแทนกองทุนลดหย่อน (%/ปี)</label>
            <input type="number" id="rateTax" value="7" step="0.1" class="input-bg w-full p-2.5 md:p-3 rounded-lg outline-none focus:border-[#38bdf8]">
        </div>

        <div class="sm:col-span-2">
            <label class="block text-sm font-medium mb-2 text-gray-300">ผลตอบแทนถ้าลงทุนเอง (%/ปี)</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="number" id="rateOwn" value="7.4" step="0.1" class="input-bg w-full sm:w-1/3 p-2.5 md:p-3 rounded-lg outline-none focus:border-[#38bdf8]">
                <button id="calcBreakEvenBtn" class="bg-[#32353e] hover:bg-[#424652] text-white px-4 py-2.5 md:py-3 rounded-lg transition-colors text-sm whitespace-nowrap flex items-center justify-center sm:flex-1 font-medium">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    คำนวณจุดคุ้มทุน (Break-Even)
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2">*คำนวณว่าต้องทำกำไรกี่ % ถึงจะชนะกองทุนภาษี</p>
        </div>
    </div>

    <script>
        let myChart = null;

        const formatCompact = (num) => {
            if (num >= 1000000) return '฿' + (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return '฿' + (num / 1000).toFixed(1) + 'K';
            return '฿' + num.toFixed(0);
        };

        const updateSimulation = () => {
            const taxBracket = parseFloat(document.getElementById('taxBracket').value) / 100;
            const principal = parseFloat(document.getElementById('principal').value);
            const years = parseInt(document.getElementById('years').value);
            const rateTax = parseFloat(document.getElementById('rateTax').value) / 100;
            const rateOwn = parseFloat(document.getElementById('rateOwn').value) / 100;

            const labels = [];
            const dataTaxFund = [];
            const dataOwnInvest = [];

            const taxRefund = principal * taxBracket;
            const ownPrincipal = principal - taxRefund;

            let finalTax = 0;
            let finalOwn = 0;

            for (let i = 0; i <= years; i++) {
                labels.push(i.toString());
                
                const valTax = (principal * Math.pow(1 + rateTax, i)) + taxRefund;
                dataTaxFund.push(valTax);
                if (i === years) finalTax = valTax;

                const valOwn = ownPrincipal * Math.pow(1 + rateOwn, i);
                dataOwnInvest.push(valOwn);
                if (i === years) finalOwn = valOwn;
            }

            document.getElementById('taxFundValue').innerText = formatCompact(finalTax);
            document.getElementById('ownInvestValue').innerText = formatCompact(finalOwn);

            const diffValueEl = document.getElementById('diffValue');
            const diffLabelEl = document.getElementById('diffLabel');
            const diff = finalOwn - finalTax;
            const absDiff = Math.abs(diff);

            if (diff > 0) {
                diffValueEl.innerText = '+' + formatCompact(absDiff);
                diffValueEl.className = 'text-2xl md:text-3xl font-bold mb-1 text-[#34d399]';
                diffLabelEl.innerText = 'ลงทุนเองได้เปรียบสุทธิ';
            } else if (diff < 0) {
                diffValueEl.innerText = '+' + formatCompact(absDiff);
                diffValueEl.className = 'text-2xl md:text-3xl font-bold mb-1 text-[#38bdf8]';
                diffLabelEl.innerText = 'กองทุนภาษีได้เปรียบสุทธิ';
            } else {
                diffValueEl.innerText = '฿0';
                diffValueEl.className = 'text-2xl md:text-3xl font-bold mb-1 text-gray-400';
                diffLabelEl.innerText = 'ผลตอบแทนเท่ากัน';
            }

            if (myChart) {
                myChart.data.labels = labels;
                myChart.data.datasets[0].data = dataTaxFund;
                myChart.data.datasets[1].data = dataOwnInvest;
                myChart.update();
            } else {
                const ctx = document.getElementById('growthChart').getContext('2d');
                Chart.defaults.color = '#9ca3af';
                Chart.defaults.font.family = "'IBM Plex Sans Thai', sans-serif";
                
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'กองทุนลดหย่อน + เงินคืนภาษี',
                                data: dataTaxFund,
                                borderColor: '#38bdf8',
                                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                pointRadius: 0,
                                pointHoverRadius: 6,
                                tension: 0.2
                            },
                            {
                                label: 'ลงทุนเอง (หักภาษีตั้งต้นแล้ว)',
                                data: dataOwnInvest,
                                borderColor: '#34d399',
                                borderWidth: 2,
                                fill: false,
                                pointRadius: 0,
                                pointHoverRadius: 6,
                                tension: 0.2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            intersect: false,
                            mode: 'index',
                        },
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { padding: 20, usePointStyle: true, font: { size: 12 } }
                            },
                            tooltip: {
                                padding: 12,
                                backgroundColor: 'rgba(27, 28, 32, 0.9)',
                                titleFont: { size: 14 },
                                bodyFont: { size: 13 },
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) label += ': ';
                                        if (context.parsed.y !== null) {
                                            label += new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(context.parsed.y);
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                border: { dash: [4, 4] },
                                grid: { color: '#32353e', drawBorder: false },
                                ticks: {
                                    callback: function(value) { return formatCompact(value); },
                                    font: { size: 11 }
                                }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { maxTicksLimit: 10, font: { size: 11 } }
                            }
                        }
                    }
                });
            }
        };

        const calculateBreakEven = () => {
            const taxBracket = parseFloat(document.getElementById('taxBracket').value) / 100;
            const principal = parseFloat(document.getElementById('principal').value);
            const years = parseInt(document.getElementById('years').value);
            const rateTax = parseFloat(document.getElementById('rateTax').value) / 100;

            const taxRefund = principal * taxBracket;
            const fvTax = (principal * Math.pow(1 + rateTax, years)) + taxRefund;
            const ownPrincipal = principal - taxRefund;
            
            if(ownPrincipal <= 0 || years <= 0) return;

            const requiredRateDec = Math.pow((fvTax / ownPrincipal), (1 / years)) - 1;
            const requiredRatePct = (requiredRateDec * 100).toFixed(2);
            
            const rateOwnInput = document.getElementById('rateOwn');
            rateOwnInput.value = requiredRatePct;
            
            updateSimulation();

            rateOwnInput.classList.add('ring-2', 'ring-[#34d399]', 'bg-green-900/20');
            setTimeout(() => {
                rateOwnInput.classList.remove('ring-2', 'ring-[#34d399]', 'bg-green-900/20');
            }, 800);
        };

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', updateSimulation);
        });
        
        document.getElementById('calcBreakEvenBtn').addEventListener('click', calculateBreakEven);

        window.addEventListener('resize', () => {
            if (myChart) myChart.resize();
        });

        updateSimulation();
    </script>
</body>
</html>
